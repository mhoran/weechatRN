name: Build and publish

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        defualt: development
        type: choice
        options:
          - development
          - production
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-ios-app:
    name: Build iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{secrets.EXPO_TOKEN}}
      - run: npm install
      - run: eas build -p ios ${{ format('--profile {0}', inputs.profile || 'production') }} --non-interactive --local
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ github.workspace }}/build-*.ipa
          retention-days: 30

  upload-ios-app:
    name: Upload iOS app
    if: github.ref_type == 'tag'
    needs: [build-ios-app]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          pattern: 'build-*.ipa'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          bundle exec fastlane pilot upload \
            --ipa build-*.ipa \
            --api_key "{
              \"key\": \"$APP_STORE_CONNECT_API_KEY\",
              \"key_id\": \"$APP_STORE_CONNECT_API_KEY_ID\",
              \"issuer_id\": \"$APP_STORE_CONNECT_API_KEY_ISSUER_ID\",
              \"is_key_content_base64\": true
            }" \
            --skip_waiting_for_build_processing true

  build-android-app:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{secrets.EXPO_TOKEN}}
      - run: npm install
      - run: eas build -p android ${{ format('--profile {0}', inputs.profile || 'production') }} --non-interactive --local
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1g -Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" -Dorg.gradle.parallel=true -Dorg.gradle.daemon=false
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ github.workspace }}/build-*.apk
          retention-days: 30

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build-ios-app, build-android-app]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          pattern: build-*.apk
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: build-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
